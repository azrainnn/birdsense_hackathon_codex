services:
  - type: web
    name: birdsense
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /species
    disk:
      name: birdsense-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BIRDSENSE_DATA_DIR
        value: /var/data
